[project]
name = "inference-server"
version = "1.0.0"
description = "Godhaar AI Inference Server — Pure ML microservice for cattle muzzle re-identification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.14.3",
    "fastapi[standard]>=0.138.1",
    "numpy>=2.5.0",
    "pillow>=12.2.0",
    "torch",
    "torchvision",
    "uvicorn>=0.49.0",
    "timm>=1.0.0",
    "opencv-python-headless>=4.10.0",
    "ultralytics>=8.0.0",
    "python-multipart>=0.0.20",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
