[project]
name = "inference-server"
version = "1.0.0"
description = "Godhaar AI Inference Server — Pure ML microservice for cattle muzzle re-identification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu==1.14.3",
    "fastapi[standard]==0.138.2",
    "numpy==2.5.0",
    "pillow==12.2.0",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "uvicorn==0.49.0",
    "timm==1.0.27",
    "opencv-python-headless==4.13.0.92",
    "ultralytics==8.4.83",
    # TFLite backend for the muzzle detector (pipeline/muzzle_detect.py).
    # ultralytics auto-installs this on first use, but that needs network and
    # a writable env — neither is guaranteed in the container, so pin it here.
    "ai-edge-litert==2.1.6",
    "python-multipart==0.0.32",
    "imageio-ffmpeg>=0.6.0",
    # DISK + LightGlue keypoint matcher for the /search fusion tiebreaker
    # (pipeline/lightglue_verify.py). Was ad hoc in experiments/lightglue_poc/
    # (see CLAUDE.md — "promote it here only if this pans out"); the FP/TP
    # validation on real Dehradun search incidents is what justified this.
    "kornia==0.8.3",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
