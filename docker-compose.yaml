name: inference-server

services:
  inference-server:
    build:
      context: .
      dockerfile: Dockerfile

    image: inference-server:dev
    container_name: inference-server.dev

    init: true

    gpus: all
    ipc: host

    ports:
      - "9001:9006"

    volumes:
      - ./appstorage:/appstorage
      - ./godhaar:/app/godhaar
      - ./pipeline:/app/pipeline
      - ./main.py:/app/main.py
      - ./helpers.py:/app/helpers.py
      - ./dependency.py:/app/dependency.py
      - ./schema.py:/app/schema.py
      - ./faiss_index.py:/app/faiss_index.py

    environment:
      PYTHONPATH: /app

      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

      MODEL_PATH: /appstorage/Models/embedding_model/model.pt
      FAISS_INDEX_PATH: /appstorage/indexes/faiss.index
      YOLO_MODEL_PATH: /app/yolov8s.pt

    restart: unless-stopped